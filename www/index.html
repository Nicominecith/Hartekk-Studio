<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hartekk-Studio</title>
<style>
:root{--bg:#0d0d12;--p:#1a1a24;--p2:#262636;--ac:#ff5a1f;--tx:#eee;--mu:#888}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
button,.btn,select{background:var(--p2);border:0;border-radius:8px;padding:10px 12px;min-height:42px}
.btn{display:inline-flex;align-items:center}
button.on{background:var(--ac);color:#000}
header{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--p);align-items:center}
header b{color:var(--ac);font-size:17px;margin-right:auto}
#bpm{width:64px;background:var(--p2);border:0;border-radius:8px;padding:10px;min-height:42px}
nav{display:flex;background:var(--p)}
nav button{flex:1;border-radius:0;background:none;border-bottom:3px solid transparent}
nav button.on{border-color:var(--ac);color:var(--ac)}
main{flex:1;overflow:auto;display:grid;gap:8px;padding:8px;align-content:start}
section{background:var(--p);border-radius:12px;padding:8px;display:none}
body[data-t=s] #s,body[data-t=p] #p,body[data-t=a] #a,body[data-t=m] #m{display:block}
.row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.nm{flex:1;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.sr{display:flex;gap:3px;margin:4px 0}
.st{flex:1;min-width:0;height:44px;padding:0;background:#2d2d3d;border-radius:6px}
.st:nth-child(4n+1){background:#3b3b52}
.st.on{background:var(--ac);color:#000}
.st.cur{outline:2px solid #fff}
.w{flex-wrap:wrap}.w .st{flex:0 0 calc(12.5% - 3px);height:46px}
.mu{color:var(--mu)}
.smp{display:flex;flex-wrap:wrap;gap:4px;max-height:55vh;overflow:auto;margin-top:8px}
.smp button{width:46px;padding:0;min-height:42px}
.sl{display:flex;align-items:center;gap:8px;margin:4px 0}.sl span{width:130px}.sl input{flex:1;height:32px;accent-color:var(--ac)}
#bar{width:70px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
@media(min-width:900px){nav{display:none}main{grid-template-columns:340px 1fr}section{display:block!important}#s{grid-row:span 3}}
</style></head><body data-t="p">
<header><b>Hartekk-Studio</b>
<button id="pl">▶</button><button id="lp" class="on">🔁</button>
<input id="bpm" type="number" min="80" max="240" value="160" aria-label="BPM">
<button id="mic">🎤</button>
<label class="btn">⬆ MP3<input id="imp" type="file" accept="audio/*" multiple hidden></label>
<button id="ex">⬇ MP3 export</button></header>
<nav><button data-t="s">Samples</button><button data-t="p" class="on">Pattern</button><button data-t="a">Song</button><button data-t="m">Mixer</button></nav>
<main>
<section id="s"><select id="cat" style="width:100%"></select><div class="mu" id="sn" style="margin-top:6px">Tippe ein Sample zum Anhören</div><div class="smp" id="sl"></div></section>
<section id="p"></section><section id="a"></section><section id="m"></section>
</main><div id="toast"></div>
<script src="lame.min.js"></script>
<script>
const $=s=>document.querySelector(s),AC=new(window.AudioContext||window.webkitAudioContext)(),NC=window.AudioContext||window.webkitAudioContext;
const S={bpm:160,pat:0,sel:null,ci:0,rev:.2,drv:0,loop:1,arr:Array(16).fill(0),tracks:[],clips:[]};
let M=[],own=[],run=null,rec=null,sv;const cache={};
const h=(t,p={},...c)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...c);return e};
const sl=(l,o,k,a,b,s)=>h('label',{className:'sl'},h('span',{textContent:l}),h('input',{type:'range',min:a,max:b,step:s,value:o[k],oninput:e=>{o[k]=+e.target.value;save2()}}));
function toast(m){const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,2600)}
window.onerror=m=>toast('Fehler: '+m);window.onunhandledrejection=e=>toast('Fehler: '+(e.reason&&e.reason.message||e.reason));
document.addEventListener('pointerdown',()=>AC.resume());
const save2=()=>{clearTimeout(sv);sv=setTimeout(()=>{try{localStorage.hk1=JSON.stringify({bpm:S.bpm,rev:S.rev,drv:S.drv,arr:S.arr,tracks:S.tracks.filter(k=>k.u).map(({buf,...k})=>k)})}catch(e){}},400)};
async function load(u){if(cache[u])return cache[u];const r=await fetch(u);if(!r.ok)throw Error('Sample fehlt: '+u);return cache[u]=await AC.decodeAudioData(await r.arrayBuffer())}
const buf=it=>it.buf||load(it.u);
function prev(b,v=1){const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g).connect(AC.destination);s.start()}
function showCat(i){S.ci=i;const L=i<M.length?M[i].f:own;$('#sl').replaceChildren(...L.map((it,j)=>h('button',{textContent:j+1,title:it.n,onclick:async()=>{S.sel=it;$('#sn').textContent='▶ '+it.n+' (gewählt)';try{prev(await buf(it))}catch(e){toast('Sample lädt nicht')}}})))}
async function addTrack(it,steps){const b=await buf(it),k={n:it.n,u:it.u,buf:b,vol:.9,pit:0,drv:0,rev:0,mute:0,p:[0,1,2,3].map(()=>Array(16).fill(0))};if(steps)for(const p of k.p)steps.forEach(i=>p[i]=1);S.tracks.push(k);render();return k}
function addClip(n,b){S.clips.push({n,buf:b,at:0,vol:.9,rev:0,drv:0,mute:0});render();toast('„'+n+'“ im Tab Song/Mixer eingefügt')}
/* ---------- Audio-Engine (gleicher Graph für Live + Export) ---------- */
const bar=()=>60/S.bpm*4;
const len=()=>{let b=0;S.arr.forEach((p,i)=>p>=0&&(b=i+1));let L=b*bar();S.clips.forEach(c=>L=Math.max(L,c.at*bar()+c.buf.duration));return Math.max(L,bar())};
const curve=a=>{const n=1024,c=new Float32Array(n),k=1+a*40;for(let i=0;i<n;i++)c[i]=Math.tanh((i*2/n-1)*k)/Math.tanh(k);return c};
const imp=c=>{const n=c.sampleRate*2|0,b=c.createBuffer(2,n,c.sampleRate);for(let q=0;q<2;q++){const d=b.getChannelData(q);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}return b};
function plan(ctx,dst,t0){
 const st=bar()/16,bus=ctx.createGain(),comp=ctx.createDynamicsCompressor(),cv=ctx.createConvolver(),rg=ctx.createGain();
 cv.buffer=imp(ctx);rg.gain.value=S.rev*.7;cv.connect(rg);rg.connect(bus);
 comp.threshold.value=-10;comp.knee.value=0;comp.ratio.value=20;comp.attack.value=.003;comp.release.value=.12;
 let n=bus;if(S.drv>0){const w=ctx.createWaveShaper();w.curve=curve(S.drv*.5);bus.connect(w);n=w}
 n.connect(comp);comp.connect(dst);
 const strip=o=>{const i=ctx.createGain(),v=ctx.createGain(),r=ctx.createGain();let x=i;if(o.drv>0){const w=ctx.createWaveShaper();w.curve=curve(o.drv);w.oversample='4x';i.connect(w);x=w}
  v.gain.value=o.vol;r.gain.value=o.rev;x.connect(v);v.connect(bus);v.connect(r);r.connect(cv);return i};
 S.tracks.forEach(k=>{if(k.mute||!k.buf)return;const ch=strip(k);let last=null;
  S.arr.forEach((p,b)=>{if(p<0)return;k.p[p].forEach((x,i)=>{if(!x)return;const T=t0+b*bar()+i*st,s=ctx.createBufferSource();
   s.buffer=k.buf;s.playbackRate.value=Math.pow(2,k.pit/12);s.connect(ch);if(last)try{last.stop(T)}catch(e){}s.start(T);last=s})})});
 S.clips.forEach(c=>{if(c.mute)return;const s=ctx.createBufferSource();s.buffer=c.buf;s.connect(strip(c));s.start(t0+c.at*bar())});
}
function stop(){if(run){clearTimeout(run.h);try{run.c.close()}catch(e){}run=null}$('#pl').textContent='▶';document.querySelectorAll('.cur').forEach(e=>e.classList.remove('cur'))}
function play(){stop();const c=new NC();c.resume();const L=len();plan(c,c.destination,.1);run={c,L};$('#pl').textContent='■';tick();
 run.h=setTimeout(()=>{if(S.loop&&run&&run.c===c)play();else stop()},(L+.1)*1000)}
function tick(){if(!run)return;const p=Math.max(0,run.c.currentTime-.1),b=bar(),bi=Math.floor(p/b),si=Math.floor(p%b/(b/16));
 document.querySelectorAll('.cur').forEach(e=>e.classList.remove('cur'));const r=$('#a .sr');if(r&&r.children[bi])r.children[bi].classList.add('cur');
 document.querySelectorAll('#p .sr').forEach(r=>r.children[si]&&r.children[si].classList.add('cur'));requestAnimationFrame(tick)}
/* ---------- MP3-Export ---------- */
async function exp(){try{stop();toast('Rendere Song …');const sr=44100,L=len()+2.5,c=new OfflineAudioContext(2,Math.ceil(L*sr),sr);plan(c,c.destination,0);
 const r=await c.startRendering(),f=a=>{const o=new Int16Array(a.length);for(let i=0;i<a.length;i++)o[i]=Math.max(-1,Math.min(1,a[i]))*32767;return o},
 l=f(r.getChannelData(0)),rr=f(r.getChannelData(1)),enc=new lamejs.Mp3Encoder(2,sr,192),out=[];toast('Kodiere MP3 …');
 for(let i=0,n=0;i<l.length;i+=1152,n++){const b=enc.encodeBuffer(l.subarray(i,i+1152),rr.subarray(i,i+1152));if(b.length)out.push(b);if(n%300==0)await new Promise(r=>setTimeout(r))}
 out.push(enc.flush());await saveFile(new Blob(out,{type:'audio/mpeg'}),'Hartekk-Song-'+Date.now()+'.mp3');toast('Fertig ✔')}catch(e){toast('Export fehlgeschlagen: '+e.message)}}
async function saveFile(blob,name){const C=window.Capacitor;
 if(C&&C.isNativePlatform&&C.isNativePlatform()){const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
  const w=await C.Plugins.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await C.Plugins.Share.share({title:name,url:w.uri,dialogTitle:'MP3 speichern / teilen'})}
 else{const a=h('a',{href:URL.createObjectURL(blob),download:name});a.click()}}
/* ---------- Stimme aufnehmen ---------- */
async function mic(){if(rec){rec.stop();return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}),ch=[];rec=new MediaRecorder(s);
  rec.ondataavailable=e=>ch.push(e.data);
  rec.onstop=async()=>{s.getTracks().forEach(t=>t.stop());rec=null;$('#mic').classList.remove('on');stop();
   try{addClip('Stimme '+(S.clips.length+1),await AC.decodeAudioData(await new Blob(ch).arrayBuffer()))}catch(e){toast('Aufnahme nicht lesbar')}};
  rec.start();$('#mic').classList.add('on');play();toast('Aufnahme läuft (Kopfhörer!) – 🎤 nochmal tippen = Stopp')}
 catch(e){rec=null;toast('Mikrofon nicht erlaubt')}}
/* ---------- UI ---------- */
function render(){
 $('#p').replaceChildren(h('div',{className:'row'},...'ABCD'.split('').map((l,i)=>h('button',{textContent:l,className:i==S.pat?'on':'',onclick:()=>{S.pat=i;render()}})),h('span',{className:'mu',textContent:'Pattern (16 Schritte)'})),
  ...S.tracks.map((k,ti)=>h('div',{},h('div',{className:'row'},
   h('button',{className:'nm',textContent:'🔊 '+k.n,onclick:async()=>{if(!S.sel)return toast('Erst im Tab Samples eins wählen = Sample tauschen');try{k.buf=await buf(S.sel);k.n=S.sel.n;k.u=S.sel.u;render()}catch(e){toast('Sample lädt nicht')}}}),
   h('button',{textContent:'M',className:k.mute?'on':'',onclick:()=>{k.mute=!k.mute;render()}}),h('button',{textContent:'✕',onclick:()=>{S.tracks.splice(ti,1);render()}})),
   h('div',{className:'sr'},...k.p[S.pat].map((x,i)=>h('button',{className:'st'+(x?' on':''),onclick:e=>{k.p[S.pat][i]=x=x?0:1;e.target.classList.toggle('on',!!x);if(x)prev(k.buf,k.vol);save2()}}))))),
  h('div',{className:'row'},h('button',{textContent:'＋ Spur mit gewähltem Sample',onclick:()=>S.sel?addTrack(S.sel):toast('Erst im Tab Samples eins wählen')})));
 $('#a').replaceChildren(h('div',{className:'mu',textContent:'Song-Ablauf: Takt antippen = Pattern A–D oder leer'}),
  h('div',{className:'sr w'},...S.arr.map((p,i)=>h('button',{className:'st'+(p>=0?' on':''),textContent:(i+1)+(p>=0?'ABCD'[p]:'–'),onclick:()=>{S.arr[i]=p>=3?-1:p+1;render()}}))),
  h('div',{className:'row'},h('button',{textContent:'＋8 Takte',onclick:()=>{S.arr.push(...Array(8).fill(-1));render()}})),
  ...S.clips.map((c,i)=>h('div',{className:'row'},h('span',{className:'nm',textContent:'🎤 '+c.n}),h('span',{className:'mu',textContent:'Takt'}),
   h('input',{id:'bar',type:'number',min:1,value:c.at+1,onchange:e=>{c.at=Math.max(0,(+e.target.value||1)-1)}}),
   h('button',{textContent:'M',className:c.mute?'on':'',onclick:()=>{c.mute=!c.mute;render()}}),h('button',{textContent:'✕',onclick:()=>{S.clips.splice(i,1);render()}}))));
 $('#m').replaceChildren(h('b',{textContent:'Master'}),sl('Hall (Reverb)',S,'rev',0,1,.01),sl('Verzerrung',S,'drv',0,1,.01),
  ...S.tracks.flatMap(k=>[h('b',{textContent:k.n}),sl('Lautstärke',k,'vol',0,1.5,.01),sl('Pitch (Halbtöne)',k,'pit',-12,12,1),sl('Verzerrung',k,'drv',0,1,.01),sl('Hall',k,'rev',0,1,.01)]),
  ...S.clips.flatMap(c=>[h('b',{textContent:'🎤 '+c.n}),sl('Lautstärke',c,'vol',0,1.5,.01),sl('Verzerrung',c,'drv',0,1,.01),sl('Hall',c,'rev',0,1,.01)]));
 save2()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.body.dataset.t=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b))});
$('#pl').onclick=()=>run?stop():play();$('#lp').onclick=e=>{S.loop=!S.loop;e.target.classList.toggle('on',!!S.loop)};
$('#bpm').onchange=e=>{S.bpm=Math.min(240,Math.max(80,+e.target.value||160));e.target.value=S.bpm;save2()};
$('#mic').onclick=mic;$('#ex').onclick=exp;$('#cat').onchange=e=>showCat(+e.target.value);
$('#imp').onchange=async e=>{for(const f of e.target.files){const n=f.name.replace(/\.\w+$/,'');try{const b=await AC.decodeAudioData(await f.arrayBuffer());own.push({n,buf:b});addClip(n,b)}catch(x){toast('Datei nicht lesbar: '+f.name)}}e.target.value='';showCat(S.ci)};
(async()=>{try{M=await(await fetch('samples/manifest.json')).json()}catch(e){toast('Sample-Pack nicht gefunden')}
 $('#cat').replaceChildren(...M.map((c,i)=>h('option',{value:i,textContent:c.c+' ('+c.f.length+')'})),h('option',{value:M.length,textContent:'Eigene (Import)'}));showCat(0);
 let sv0=null;try{sv0=JSON.parse(localStorage.hk1||'null')}catch(e){}
 try{if(sv0&&sv0.tracks&&sv0.tracks.length){Object.assign(S,{bpm:sv0.bpm,rev:sv0.rev,drv:sv0.drv,arr:sv0.arr});$('#bpm').value=S.bpm;
   for(const k of sv0.tracks){try{k.buf=await load(k.u);S.tracks.push(k)}catch(e){}}}
  else{const f=s=>{const c=M.find(c=>c.c.includes(s));return c&&c.f[0]};
   for(const[s,st]of[['TEKK',[0,4,8,12]],['SNARE',[4,12]],['FANCY',[2,6,10,14]]]){const it=f(s);if(it)await addTrack(it,st)}}}catch(e){toast('Start-Projekt konnte nicht geladen werden')}
 render()})();
</script></body></html>
