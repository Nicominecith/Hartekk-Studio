<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hartekk-Studio</title>
<style>

.tr{display:flex;gap:4px}.tr button{width:44px;font-size:17px;padding:0}

.row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.nm{flex:1;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;background:linear-gradient(#2a3036,#20262b)}
.led{width:30px;padding:0;color:#2a5}.led.on{background:linear-gradient(#aaf59a,#3fb02a);color:#000}
.sr{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
.st{flex:0 0 calc(12.5% - 3px);height:42px;padding:0;border-radius:4px;background:linear-gradient(#59636c,#4a535b)}
.st:nth-child(8n+5),.st:nth-child(8n+6),.st:nth-child(8n+7),.st:nth-child(8n+8){background:linear-gradient(#6d7882,#5b656e)}
.st.on{background:linear-gradient(#ffa24a,#f0560f);box-shadow:0 0 8px #ff7a1a88,inset 0 1px #fff6}

.plw{overflow-x:auto;border-radius:6px;background:var(--in)}
.pli{position:relative}

.lane.pt{display:flex;height:40px}
.pc{flex:0 0 72px;height:40px;border-radius:0;background:none;box-shadow:none;border-left:1px solid #fff3;padding:0;font-weight:800}
.pc.on{background:#ff7a1a55;color:var(--ac2)}

.clip small{position:absolute;left:4px;top:1px;font-size:10px;pointer-events:none;white-space:nowrap;text-shadow:0 1px #000}

.mx{background:var(--in);border-radius:6px;padding:8px}.mx b{display:block;margin-bottom:4px;color:var(--ac2)}
.sl{display:flex;align-items:center;gap:8px;margin:2px 0}.sl span{width:92px;font-size:12px;color:var(--mu)}.sl input{flex:1;height:30px;accent-color:var(--ac)}

@media(min-width:900px){nav{display:none}main{grid-template-columns:320px 1fr}section{display:block!important}#s{grid-row:span 3}}
</style></head><body data-t="p">
<header><b class="logo">HARTEKK<i>·STUDIO</i></b>
<div class="tr"><button id="pl">▶</button><button id="sp0">■</button><button id="mic">⏺</button><button id="lp" class="on">⟳</button></div>
<div class="lcd"><input id="bpm" type="number" min="80" max="240" value="160"><small>BPM</small></div><div class="lcd" id="tm">001:1</div>
<div class="fl"><button id="op">📂 Öffnen</button><button id="sp">💾 Projekt</button><label class="btn">⬆ Audio<input id="imp" type="file" accept="audio/*" multiple hidden></label><button id="ex">⬇ MP3</button></div>
<input id="opf" type="file" accept="*/*" hidden></header>
<main>
<section id="s"><h4>Browser</h4><select id="cat" style="width:100%"></select><div class="mu" id="sn" style="margin-top:6px">Tippe ein Sample zum Anhören</div><div class="smp" id="sl"></div></section>
<section id="p"></section><section id="a"></section><section id="m"></section>
</main>
<nav><button data-t="s">🎛 Samples</button><button data-t="p" class="on">🥁 Rack</button><button data-t="a">🎞 Playlist</button><button data-t="m">🎚 Mixer</button></nav>
<div id="toast"></div>
<script src="lame.min.js"></script>
<script>
const $=s=>document.querySelector(s),AC=new(window.AudioContext||window.webkitAudioContext)(),OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
const S={bpm:160,pat:0,sel:null,ci:0,rev:.2,drv:0,loop:1,arr:Array(16).fill(0),tracks:[],clips:[]},PX=72,LH=48,NL=5;
let M=[],own=[],sv,tm=null,et=null,on=0,g=0,nt=0,q=[],cur=-1;const cache={},live=new Set(),last=new Map();

const toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,2800)};
window.onerror=m=>toast('Fehler: '+m);window.onunhandledrejection=e=>toast('Fehler: '+(e.reason&&e.reason.message||e.reason));
document.addEventListener('pointerdown',()=>AC.resume());
const b64=ab=>{let s='';const u=new Uint8Array(ab);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)},unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)).buffer;
const bar=()=>60/S.bpm*4;
const curve=a=>{const n=1024,c=new Float32Array(n),k=1+a*40;for(let i=0;i<n;i++)c[i]=Math.tanh((i*2/n-1)*k)/Math.tanh(k);return c};
const imp=c=>{const n=c.sampleRate*2|0,b=c.createBuffer(2,n,c.sampleRate);for(let q=0;q<2;q++){const d=b.getChannelData(q);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}return b};
const peaks=b=>{const d=b.getChannelData(0),n=160,k=Math.floor(d.length/n)||1,o=[];for(let i=0;i<n;i++){let m=0;for(let j=i*k;j<(i+1)*k&&j<d.length;j+=8)m=Math.max(m,Math.abs(d[j]));o.push(Math.min(1,m))}return o};
function setup(o,n){n.v.gain.value=o.mute?0:o.vol;n.r.gain.value=o.rev;n.w.curve=o.drv>0?curve(o.drv):null}
function chain(ctx,dst){const bus=ctx.createGain(),mw=ctx.createWaveShaper(),comp=ctx.createDynamicsCompressor(),cv=ctx.createConvolver(),rg=ctx.createGain();
 cv.buffer=imp(ctx);cv.connect(rg);rg.connect(bus);comp.threshold.value=-10;comp.knee.value=0;comp.ratio.value=20;comp.attack.value=.003;comp.release.value=.12;bus.connect(mw);mw.connect(comp);comp.connect(dst);
 const C={mset(){rg.gain.value=S.rev*.7;mw.curve=S.drv>0?curve(S.drv*.5):null},
  mk(o){const i=ctx.createGain(),w=ctx.createWaveShaper(),v=ctx.createGain(),r=ctx.createGain();w.oversample='2x';i.connect(w);w.connect(v);v.connect(bus);v.connect(r);r.connect(cv);const n={i,w,v,r};setup(o,n);return n}};C.mset();return C}
const L=chain(AC,AC.destination),rm=o=>{if(o.nd)try{o.nd.i.disconnect();o.nd.v.disconnect();o.nd.r.disconnect()}catch(e){}};
function upd(o){if(o===S)L.mset();else if(o.nd)setup(o,o.nd);save2()}
const sl=(l,o,k,a,b,s)=>h('label',{className:'sl'},h('span',{textContent:l}),h('input',{type:'range',min:a,max:b,step:s,value:o[k],oninput:e=>{o[k]=+e.target.value;upd(o)}}));
/* ---------- Speichern / Projekt ---------- */
function proj(lt){const ok=o=>!(lt&&o.raw);return JSON.stringify({v:1,bpm:S.bpm,rev:S.rev,drv:S.drv,arr:S.arr,tracks:S.tracks.filter(ok).map(({buf,nd,raw,...k})=>({...k,raw:raw&&b64(raw)})),clips:S.clips.filter(ok).map(({buf,nd,raw,pk,...c})=>({...c,raw:raw&&b64(raw)}))})}
const save2=()=>{clearTimeout(sv);sv=setTimeout(()=>{try{localStorage.hk2=proj(1)}catch(e){}},900)};
async function openProj(txt){const d=JSON.parse(txt);stopAll();[...S.tracks,...S.clips].forEach(rm);
 const dec=async o=>{if(o.raw){o.raw=unb64(o.raw);o.buf=await AC.decodeAudioData(o.raw.slice(0))}else o.buf=await load(o.u);o.nd=L.mk(o);return o},T=[],C=[];
 for(const k of d.tracks)try{T.push(await dec(k))}catch(e){}for(const c of d.clips){await dec(c);c.pk=peaks(c.buf);C.push(c)}
 Object.assign(S,{bpm:d.bpm,rev:d.rev,drv:d.drv,arr:d.arr,tracks:T,clips:C});$('#bpm').value=S.bpm;L.mset();render()}
async function saveFile(blob,name){const C=window.Capacitor;
 if(C&&C.isNativePlatform&&C.isNativePlatform()){const d=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});
  const w=await C.Plugins.Filesystem.writeFile({path:name,data:d,directory:'CACHE'});await C.Plugins.Share.share({title:name,url:w.uri,dialogTitle:'Speichern / teilen'})}
 else h('a',{href:URL.createObjectURL(blob),download:name}).click()}
/* ---------- Samples ---------- */
async function load(u){if(cache[u])return cache[u];const r=await fetch(u);if(!r.ok)throw Error('Sample fehlt: '+u);return cache[u]=await AC.decodeAudioData(await r.arrayBuffer())}
const buf=it=>it.buf||load(it.u);
function prev(b,v=1){const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g).connect(AC.destination);s.start()}
function showCat(i){S.ci=i;const A=i<M.length?M[i].f:own;$('#sl').replaceChildren(...A.map((it,j)=>h('button',{textContent:j+1,title:it.n,onclick:async()=>{S.sel=it;$('#sn').textContent='▶ '+it.n+' (gewählt)';try{prev(await buf(it))}catch(e){toast('Sample lädt nicht')}}})))}
async function addTrack(it,steps){const b=await buf(it),k={n:it.n,u:it.u,raw:it.raw,buf:b,vol:.9,pit:0,drv:0,rev:0,mute:0,p:[0,1,2,3].map(()=>Array(16).fill(0))};if(steps)for(const p of k.p)steps.forEach(i=>p[i]=1);k.nd=L.mk(k);S.tracks.push(k);render();return k}
function addClip(n,b,raw){const c={n,buf:b,raw,at:0,lane:1+S.clips.length%NL,vol:.9,rev:0,drv:0,mute:0,pk:peaks(b)};c.nd=L.mk(c);S.clips.push(c);render();toast('„'+n+'“ liegt in der Playlist – verschieben per Ziehen')}
/* ---------- Live-Scheduler: Änderungen greifen sofort ---------- */
const total=()=>{let b=0;S.arr.forEach((p,i)=>p>=0&&(b=i+1));const st=bar()/16;S.clips.forEach(c=>b=Math.max(b,Math.ceil((c.at+c.buf.duration/st)/16)));return Math.max(b,1)*16};
function fire(X,pos,T){const bi=Math.floor(pos/16),si=pos%16,p=S.arr[bi],reg=s=>{if(X.live){X.live.add(s);s.onended=()=>X.live.delete(s)}};
 if(p>=0)S.tracks.forEach(k=>{if(k.mute||!k.buf||!k.p[p][si])return;const s=X.ctx.createBufferSource();s.buffer=k.buf;s.playbackRate.value=Math.pow(2,k.pit/12);s.connect(X.sp(k));const l=X.last.get(k);if(l)try{l.stop(T)}catch(e){}s.start(T);X.last.set(k,s);reg(s)});
 S.clips.forEach(c=>{if(c.at===pos&&!c.mute){const s=X.ctx.createBufferSource();s.buffer=c.buf;s.connect(X.sp(c));s.start(T);reg(s)}})}
function sched(){const X={ctx:AC,sp:o=>o.nd.i,live,last};if(nt<AC.currentTime-.5)nt=AC.currentTime;const tot=total();
 while(nt<AC.currentTime+.15){if(g>=tot&&!S.loop){clearInterval(tm);tm=null;et=setTimeout(stopAll,2500);return}const pos=g%tot;fire(X,pos,nt);q.push({t:nt,g:pos});nt+=bar()/16;g++}}
function play(){AC.resume();stopAll();g=0;nt=AC.currentTime+.08;q=[];on=1;tm=setInterval(sched,25);sched();$('#pl').classList.add('on');tick()}
function stopAll(){on=0;clearInterval(tm);clearTimeout(et);tm=null;live.forEach(s=>{try{s.stop()}catch(e){}});live.clear();last.clear();$('#pl').classList.remove('on');const p=$('#ph');if(p)p.style.display='none';document.querySelectorAll('.cur').forEach(e=>e.classList.remove('cur'));cur=-1;$('#tm').textContent='001:1'}
function tick(){if(!on)return;const now=AC.currentTime;while(q.length>1&&q[1].t<=now)q.shift();const e=q[0];
 if(e){const f=e.g+Math.max(0,(now-e.t)/(bar()/16)),p=$('#ph'),si=e.g%16;if(p)p.style.cssText='display:block;transform:translateX('+f/16*PX+'px)';
  $('#tm').textContent=String(Math.floor(e.g/16)+1).padStart(3,'0')+':'+(Math.floor(si/4)+1);
  if(si!==cur){document.querySelectorAll('.st.cur').forEach(x=>x.classList.remove('cur'));document.querySelectorAll('#p .sr').forEach(r=>r.children[si]&&r.children[si].classList.add('cur'));cur=si}}
 requestAnimationFrame(tick)}
/* ---------- MP3-Export ---------- */
async function exp(){try{stopAll();toast('Rendere Song …');const sr=44100,st=bar()/16,n=total(),oc=new OC(2,Math.ceil((n*st+2.5)*sr),sr),O=chain(oc,oc.destination),m=new Map();
 S.tracks.concat(S.clips).forEach(o=>m.set(o,O.mk(o)));const X={ctx:oc,sp:o=>m.get(o),live:null,last:new Map()};for(let i=0;i<n;i++)fire(X,i,i*st);
 const r=await oc.startRendering(),f=a=>{const o=new Int16Array(a.length);for(let i=0;i<a.length;i++)o[i]=Math.max(-1,Math.min(1,a[i]))*32767;return o},
 l=f(r.getChannelData(0)),rr=f(r.getChannelData(1)),enc=new lamejs.Mp3Encoder(2,sr,192),out=[];toast('Kodiere MP3 …');
 for(let i=0,c=0;i<l.length;i+=1152,c++){const b=enc.encodeBuffer(l.subarray(i,i+1152),rr.subarray(i,i+1152));if(b.length)out.push(b);if(c%300==0)await new Promise(r=>setTimeout(r))}
 out.push(enc.flush());await saveFile(new Blob(out,{type:'audio/mpeg'}),'Hartekk-Song-'+Date.now()+'.mp3');toast('Fertig ✔')}catch(e){toast('Export fehlgeschlagen: '+e.message)}}
/* ---------- Stimme aufnehmen ---------- */
let rec=null;async function mic(){if(rec){rec.stop();return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}),ch=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>ch.push(e.data);
  rec.onstop=async()=>{s.getTracks().forEach(t=>t.stop());rec=null;$('#mic').classList.remove('on');stopAll();try{const raw=await new Blob(ch).arrayBuffer();addClip('Stimme '+(S.clips.length+1),await AC.decodeAudioData(raw.slice(0)),raw)}catch(e){toast('Aufnahme nicht lesbar')}};
  rec.start();$('#mic').classList.add('on');play();toast('Aufnahme läuft (Kopfhörer!) – ⏺ nochmal = Stopp')}catch(e){rec=null;toast('Mikrofon nicht erlaubt')}}
/* ---------- UI ---------- */
function clipEl(c,st){const w=Math.max(30,c.buf.duration/st/16*PX),bw=Math.min(2000,w|0),cl=h('div',{className:'clip',style:'width:'+w+'px'}),cv=h('canvas',{width:bw,height:36}),x=cv.getContext('2d');
 x.strokeStyle='#fffb';c.pk.forEach((v,i)=>{const X=i/c.pk.length*bw;x.beginPath();x.moveTo(X,18-v*17);x.lineTo(X,18+v*17);x.stroke()});
 cl.append(h('small',{textContent:c.n}),cv,h('u',{textContent:'✕',onpointerdown:e=>e.stopPropagation(),onclick:()=>{rm(c);S.clips.splice(S.clips.indexOf(c),1);render()}}));
 const put=()=>{cl.style.left=c.at/16*PX+'px';cl.style.top=64+(c.lane-1)*LH+'px'};put();
 cl.onpointerdown=e=>{cl.setPointerCapture(e.pointerId);const x0=e.clientX,y0=e.clientY,a0=c.at,l0=c.lane;
  cl.onpointermove=m=>{c.at=Math.max(0,Math.round((a0+(m.clientX-x0)/PX*16)/4)*4);c.lane=Math.max(1,Math.min(NL,l0+Math.round((m.clientY-y0)/LH)));put()};
  cl.onpointerup=()=>{cl.onpointermove=null;save2()}};return cl}
function renderPL(){const nb=Math.max(S.arr.length,Math.ceil(total()/16)),st=bar()/16,rows=[h('div',{className:'ruler'},...Array.from({length:nb},(_,i)=>h('i',{textContent:i+1}))),
  h('div',{className:'lane pt'},...S.arr.map((p,i)=>h('button',{className:'pc'+(p>=0?' on':''),textContent:p>=0?'ABCD'[p]:'',onclick:()=>{S.arr[i]=p>=3?-1:p+1;render()}})))];
 for(let l=0;l<NL;l++)rows.push(h('div',{className:'lane'}));
 $('#a').replaceChildren(h('h4',{textContent:'Playlist'}),h('div',{className:'row'},h('span',{className:'mu',textContent:'Oberste Spur: Takt tippen = Pattern A–D. Clips ziehen = verschieben.'}),h('button',{textContent:'＋8 Takte',onclick:()=>{S.arr.push(...Array(8).fill(-1));render()}})),
  h('div',{className:'plw'},h('div',{className:'pli',style:'width:'+nb*PX+'px'},...rows,h('div',{id:'ph'}),...S.clips.map(c=>clipEl(c,st)))))}
function render(){
 $('#p').replaceChildren(h('h4',{textContent:'Channel Rack'}),h('div',{className:'row'},...'ABCD'.split('').map((l,i)=>h('button',{textContent:l,className:i==S.pat?'on':'',onclick:()=>{S.pat=i;render()}})),h('span',{className:'mu',textContent:'Pattern'})),
  ...S.tracks.map((k,ti)=>h('div',{},h('div',{className:'row'},
   h('button',{className:'led'+(k.mute?'':' on'),textContent:'●',onclick:()=>{k.mute=!k.mute;upd(k);render()}}),
   h('button',{className:'nm',textContent:k.n,onclick:async()=>{if(!S.sel)return toast('Erst im Tab Samples eins wählen = Sample tauschen');try{k.buf=await buf(S.sel);k.n=S.sel.n;k.u=S.sel.u;k.raw=S.sel.raw;render()}catch(e){toast('Sample lädt nicht')}}}),
   h('button',{textContent:'✕',onclick:()=>{rm(k);S.tracks.splice(ti,1);render()}})),
   h('div',{className:'sr'},...k.p[S.pat].map((x,i)=>h('button',{className:'st'+(x?' on':''),onclick:e=>{k.p[S.pat][i]=x=x?0:1;e.target.classList.toggle('on',!!x);if(x)prev(k.buf,k.vol);save2()}}))))),
  h('div',{className:'row'},h('button',{textContent:'＋ Spur mit gewähltem Sample',onclick:()=>S.sel?addTrack(S.sel):toast('Erst im Tab Samples eins wählen')})));

  h('div',{className:'mx'},h('b',{textContent:'MASTER'}),sl('Hall',S,'rev',0,1,.01),sl('Verzerrung',S,'drv',0,1,.01)),
  ...S.tracks.map(k=>h('div',{className:'mx'},h('b',{textContent:k.n}),sl('Lautstärke',k,'vol',0,1.5,.01),sl('Pitch',k,'pit',-12,12,1),sl('Verzerrung',k,'drv',0,1,.01),sl('Hall',k,'rev',0,1,.01))),
  ...S.clips.map(c=>h('div',{className:'mx'},h('b',{textContent:'🎤 '+c.n}),sl('Lautstärke',c,'vol',0,1.5,.01),sl('Verzerrung',c,'drv',0,1,.01),sl('Hall',c,'rev',0,1,.01)))));
 cur=-1;save2()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.body.dataset.t=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b))});
$('#pl').onclick=()=>on?stopAll():play();$('#sp0').onclick=stopAll;$('#lp').onclick=e=>{S.loop=!S.loop;e.currentTarget.classList.toggle('on',!!S.loop)};

$('#mic').onclick=mic;$('#ex').onclick=exp;$('#cat').onchange=e=>showCat(+e.target.value);

$('#op').onclick=()=>$('#opf').click();

$('#imp').onchange=async e=>{for(const f of e.target.files){const n=f.name.replace(/\.\w+$/,'');try{const raw=await f.arrayBuffer(),b=await AC.decodeAudioData(raw.slice(0));own.push({n,buf:b,raw});addClip(n,b,raw)}catch(x){toast('Datei nicht lesbar: '+f.name)}}e.target.value='';showCat(S.ci)};
(async()=>{try{M=await(await fetch('samples/manifest.json')).json();M.sort((a,b)=>/KICK/.test(b.c)-/KICK/.test(a.c))}catch(e){toast('Sample-Pack nicht gefunden')}

  for(const[s,st]of[['TEKK',[0,4,8,12]],['SNARE',[4,12]],['FANCY',[2,6,10,14]]]){const it=f(s);if(it)await addTrack(it,st)}}}catch(e){toast('Start-Projekt konnte nicht geladen werden')}
